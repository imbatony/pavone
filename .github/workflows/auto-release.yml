name: Auto Version Bump and Release

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-release-main
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'release:skip')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: "3.12"

      - name: Detect an existing release commit
        id: existing
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          EXISTING_VERSION=""
          while IFS= read -r RELEASE_TAG; do
            RELEASE_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
            if git show -s --format=%B "$RELEASE_COMMIT" | grep -Fxq "Release-PR: #${PR_NUMBER}"; then
              EXISTING_VERSION="${RELEASE_TAG#v}"
              break
            fi
          done < <(git tag --list "v*" --sort=-version:refname)
          echo "existing_version=$EXISTING_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare deterministic release
        id: prepare
        env:
          EXISTING_VERSION: ${{ steps.existing.outputs.existing_version }}
        run: |
          ARGS=(
            --event "$GITHUB_EVENT_PATH"
            --notes-output "$RUNNER_TEMP/release-notes.md"
          )
          if [ -n "$EXISTING_VERSION" ]; then
            ARGS+=(--existing-version "$EXISTING_VERSION")
          fi
          python scripts/prepare_release.py "${ARGS[@]}"

      - name: Commit version and changelog
        if: steps.existing.outputs.existing_version == ''
        env:
          NEW_VERSION: ${{ steps.prepare.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml pavone/__init__.py CHANGELOG.md
          git commit \
            -m "chore: bump version to $NEW_VERSION" \
            -m "Release-PR: #$PR_NUMBER"
          git tag "v$NEW_VERSION"
          git push --atomic origin HEAD:main "v$NEW_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.prepare.outputs.new_version }}
          RELEASE_TITLE: ${{ steps.prepare.outputs.release_title }}
        run: |
          if gh release view "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Release v$NEW_VERSION already exists"
            exit 0
          fi
          gh release create "v$NEW_VERSION" \
            --target main \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
